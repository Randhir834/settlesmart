<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3D0385" />
    <meta name="msapplication-TileColor" content="#3D0385" />
    <meta name="msapplication-TileImage" content="/icon-192.png?v=2" />
    <meta name="application-name" content="Settsmartly" />
    <meta name="apple-mobile-web-app-title" content="Settsmartly" />

    <!-- Primary meta. scripts/prerender.mjs rewrites these per page from src/data/pages.json; PageMeta keeps them in sync on client navigation. -->
    <title>Settsmartly: Split Rent, Bills &amp; Expenses with Flatmates</title>
    <meta name="description" content="The expense app for flatmates in India. Split rent, bills and groceries, see who paid and who owes, and settle up at the end of every month." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://settsmartly.com/" />
    <meta name="author" content="Settsmartly" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Search Console / Bing Webmaster verification tags are added at build time from VITE_GOOGLE_SITE_VERIFICATION and VITE_BING_SITE_VERIFICATION -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://settsmartly.com/" />
    <meta property="og:site_name" content="Settsmartly" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Settsmartly: Split Rent, Bills &amp; Expenses with Flatmates" />
    <meta property="og:description" content="The expense app for flatmates in India. Split rent, bills and groceries, see who paid and who owes, and settle up at the end of every month." />
    <meta property="og:image" content="https://settsmartly.com/og-image.png?v=2" />
    <meta property="og:image:secure_url" content="https://settsmartly.com/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Settsmartly: the expense app for flatmates sharing a flat in India" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Settsmartly: Split Rent, Bills &amp; Expenses with Flatmates" />
    <meta name="twitter:description" content="The expense app for flatmates in India. Split rent, bills and groceries, see who paid and who owes, and settle up at the end of every month." />
    <meta name="twitter:image" content="https://settsmartly.com/og-image.png?v=2" />
    <meta name="twitter:image:alt" content="Settsmartly: the expense app for flatmates sharing a flat in India" />

    <!-- Structured data (JSON-LD) for each page is injected here at build time. See src/seo/schema.ts. -->
    <!--app-head-->

    <!-- Scroll-reveal animations hide content only when JavaScript runs, so no-JS crawlers and readers see everything. -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Fonts are self-hosted (@fontsource-variable, imported in src/main.tsx); prerender.mjs adds preload links for the Latin files. -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
