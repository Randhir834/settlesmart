    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://settsmartly.com/#org",
          "name": "Settsmartly",
          "url": "https://settsmartly.com",
          "logo": "https://settsmartly.com/icon-512.png?v=2",
          "slogan": "Your household. Your money. One smart platform.",
          "sameAs": ["https://www.linkedin.com/company/settsmartly"]
        },
        {
          "@type": "WebSite",
          "@id": "https://settsmartly.com/#website",
          "name": "Settsmartly",
          "url": "https://settsmartly.com",
          "publisher": { "@id": "https://settsmartly.com/#org" },
          "inLanguage": "en-IN"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Settsmartly?",
              "acceptedAnswer": { "@type": "Answer", "text": "Settsmartly is a household financial management platform for people who live together. It brings shared expenses, recurring bills, member contributions and settlements into one place, with an AI assistant you can talk to." }
            },
            {
              "@type": "Question",
              "name": "Is Settsmartly free?",
              "acceptedAnswer": { "@type": "Answer", "text": "The core experience will be free: households, expense splitting, balances and access to your own records. Optional paid plans will add things like more AI usage and advanced household features." }
            },
            {
              "@type": "Question",
              "name": "How does the voice assistant work?",
              "acceptedAnswer": { "@type": "Answer", "text": "You describe an expense in English, Hindi or Hinglish. The assistant prepares a draft with the amount, payer, members and split; the expense engine calculates the shares, and nothing is saved until you confirm. The voice assistant is planned and in development." }
            },
            {
              "@type": "Question",
              "name": "Does Settsmartly automatically deduct money?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. Recording an expense does not automatically transfer money. Payments are made through the selected payment method, with settlement status recorded separately." }
            }
          ]
        }
      ]
    }
    </script>
