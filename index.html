    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://settsmartly.com/#org",
          "name": "Settsmartly",
          "url": "https://settsmartly.com",
          "logo": "https://settsmartly.com/icon-512.png",
          "slogan": "Split. Track. Settle. Smartly.",
          "sameAs": ["https://www.linkedin.com/company/settsmartly"]
        },
        {
          "@type": "WebSite",
          "@id": "https://settsmartly.com/#website",
          "name": "Settsmartly",
          "url": "https://settsmartly.com",
          "publisher": { "@id": "https://settsmartly.com/#org" },
          "inLanguage": "en-IN"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Settsmartly?",
              "acceptedAnswer": { "@type": "Answer", "text": "Settsmartly is a shared expense management application that helps people record expenses, split bills, track outstanding balances and organize settlements." }
            },
            {
              "@type": "Question",
              "name": "Is Settsmartly free?",
              "acceptedAnswer": { "@type": "Answer", "text": "Settsmartly will offer a free plan with essential expense management features, alongside optional paid plans for advanced capabilities." }
            },
            {
              "@type": "Question",
              "name": "Can I split expenses unequally?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. The platform is designed to support equal, percentage-based, exact-amount and shares-based splitting." }
            },
            {
              "@type": "Question",
              "name": "Does Settsmartly automatically deduct money?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. Recording an expense does not automatically transfer money. Payments are made through the selected payment method, with settlement status recorded separately." }
            }
          ]
        }
      ]
    }
